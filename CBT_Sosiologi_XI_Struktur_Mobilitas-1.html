<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBT Sosiologi XI — Struktur, Diferensiasi & Mobilitas Sosial</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#17202a}
.wrap{max-width:820px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 28px #0001}
h1{margin:0 0 8px;font-size:25px}.muted{color:#607080}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.timer{font-weight:700;padding:10px 14px;border-radius:10px;background:#fff1f1;color:#b42318}.bar{height:8px;background:#e7edf3;border-radius:99px;overflow:hidden;margin:12px 0 22px}.fill{height:100%;background:#2463eb;width:0;transition:.2s}
.q{font-size:19px;line-height:1.55;font-weight:700;margin:18px 0}.opt{display:block;width:100%;text-align:left;border:2px solid #dbe3ec;background:#fff;border-radius:12px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer}.opt:hover{background:#f5f8fc}.opt:disabled{cursor:default}.correct{border-color:#159447!important;background:#eaf8ef!important}.wrong{border-color:#d92d20!important;background:#fff0ee!important}
.feedback{display:none;border-radius:12px;padding:15px;margin-top:16px;line-height:1.5}.fb-c{background:#eaf8ef;color:#075e2c}.fb-w{background:#fff0ee;color:#8a1c14}.next{display:none;margin-top:15px;width:100%;padding:13px;border:0;border-radius:11px;background:#2463eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.result{text-align:center}.score{font-size:48px;font-weight:800;margin:12px}.start{margin-top:15px;width:100%;padding:14px;border:0;border-radius:11px;background:#172f67;color:white;font-weight:700;font-size:17px;cursor:pointer}
.hidden{display:none!important}.meta{font-size:14px;color:#64748b}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div id="start">
<h1>CBT Sosiologi XI</h1>
<p class="muted">Struktur Sosial • Stratifikasi • Diferensiasi • Mobilitas Sosial</p>
<p>25 soal × 4 poin = <b>100</b>. Waktu <b>2 menit per soal</b>. Setelah memilih jawaban, hasil dan pembahasan singkat langsung tampil.</p>
<button class="start" onclick="begin()">Mulai Kuis</button>
</div>
<div id="quiz" class="hidden">
<div class="top"><div><b id="num"></b><div class="meta" id="score"></div></div><div class="timer" id="timer">02:00</div></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="q" id="question"></div><div id="options"></div>
<div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQ()">Soal Berikutnya →</button>
</div>
<div id="result" class="hidden result">
<h1>Kuis Selesai</h1><div class="score" id="finalScore"></div><p id="finalText"></p>
<button class="start" onclick="location.reload()">Ulangi Kuis</button>
</div>
</div></div>
<script>
const questions=[
{q:"Di sebuah sekolah, siswa berbeda menurut asal daerah, tingkat ekonomi keluarga, prestasi akademik, dan organisasi yang diikuti. Namun, perbedaan tersebut tidak selalu menentukan tinggi-rendahnya kedudukan seseorang. Konsep yang paling tepat untuk membaca keadaan tersebut adalah ...",a:["struktur sosial sebagai susunan hubungan dan posisi sosial","stratifikasi sosial sebagai pembagian masyarakat secara bertingkat","diferensiasi sosial sebagai pembagian masyarakat secara horizontal","mobilitas sosial sebagai perpindahan seseorang antarposisi"],c:0,e:"Struktur sosial mencakup susunan status, peran, kelompok, dan pola hubungan sosial. Tidak semua perbedaan sosial berbentuk tingkatan."},
{q:"Sebuah masyarakat membedakan penduduk berdasarkan kekayaan. Orang kaya memperoleh akses pendidikan dan jaringan yang lebih luas sehingga peluang ekonominya semakin besar. Keadaan tersebut menunjukkan bahwa stratifikasi sosial terutama ditandai oleh ...",a:["perbedaan identitas sosial yang kedudukannya setara","pembagian sosial yang membentuk susunan kedudukan bertingkat","perbedaan kebudayaan yang tidak berkaitan dengan prestise","pengelompokan berdasarkan kesamaan minat dan tujuan"],c:1,e:"Stratifikasi bersifat vertikal karena terdapat lapisan tinggi-rendah berdasarkan ukuran tertentu seperti kekayaan, kekuasaan, atau prestise."},
{q:"Dalam suatu kerajaan, seseorang hanya dapat menjadi bangsawan jika dilahirkan dari keluarga bangsawan. Kekayaan yang diperoleh kemudian tidak otomatis mengubah status keturunannya. Sifat stratifikasi yang paling tepat adalah ...",a:["terbuka, karena setiap orang bebas mencapai status tertentu","campuran, karena status ditentukan oleh prestasi dan keturunan","terbuka, karena perpindahan status berlangsung melalui pendidikan","tertutup, karena status utama melekat berdasarkan kelahiran"],c:3,e:"Stratifikasi tertutup membatasi perpindahan antarlapisan. Status bangsawan dalam contoh ditentukan terutama oleh kelahiran."},
{q:"Di perusahaan A, jabatan manajer dapat dicapai pegawai dari latar belakang keluarga apa pun melalui kinerja dan seleksi. Akan tetapi, jabatan tersebut tetap memiliki tingkat wewenang yang berbeda dari staf. Sistem stratifikasi ini paling tepat disebut ...",a:["stratifikasi terbuka, karena mobilitas vertikal memungkinkan","stratifikasi tertutup, karena jabatan dibedakan secara hierarkis","diferensiasi sosial, karena semua jabatan memiliki kedudukan sama","diferensiasi sosial, karena perbedaan hanya berdasarkan profesi"],c:0,e:"Stratifikasi terbuka tetap memiliki lapisan tinggi-rendah, tetapi peluang naik atau turun relatif terbuka melalui prestasi dan mekanisme sosial."},
{q:"Masyarakat X memiliki kelompok pejabat, pengusaha, dan buruh. Ketiganya memiliki peran berbeda, tetapi tidak ada anggapan bahwa salah satu kelompok secara otomatis lebih tinggi atau lebih rendah berdasarkan kategorinya. Hal ini lebih tepat disebut ...",a:["stratifikasi karena terdapat kelompok dengan fungsi berbeda","diferensiasi karena perbedaan berlangsung secara horizontal","mobilitas karena anggota dapat berpindah pekerjaan","struktur tertutup karena kategori sosial sudah ditetapkan"],c:1,e:"Diferensiasi sosial menunjukkan perbedaan horizontal. Perbedaan profesi tidak otomatis berarti adanya tingkatan prestise atau kekuasaan."},
{q:"Seorang siswa berasal dari keluarga bermarga tertentu. Ia tetap membawa marga tersebut meskipun pindah sekolah, memperoleh prestasi tinggi, dan berganti pekerjaan ketika dewasa. Marga dalam konteks diferensiasi sosial terutama menunjukkan ...",a:["lapisan ekonomi yang menentukan kedudukan sosial","identitas keturunan yang membedakan kelompok secara horizontal","tingkat kekuasaan yang membentuk hierarki sosial","status yang selalu berubah mengikuti pencapaian individu"],c:1,e:"Marga dapat menjadi penanda identitas genealogis atau keturunan. Dalam diferensiasi, identitas tersebut membedakan kelompok tanpa harus menunjukkan tinggi-rendah."},
{q:"Dua siswa berasal dari suku berbeda tetapi duduk di kelas yang sama, memperoleh hak pendidikan yang sama, dan memiliki kesempatan menjadi ketua kelas yang sama. Analisis yang paling tepat adalah ...",a:["perbedaan suku merupakan stratifikasi karena membentuk lapisan","perbedaan suku merupakan mobilitas karena status siswa berubah","perbedaan suku merupakan diferensiasi karena tidak menunjukkan hierarki","perbedaan suku merupakan struktur tertutup karena berasal dari kelahiran"],c:2,e:"Suku merupakan salah satu bentuk diferensiasi sosial apabila dipahami sebagai identitas kelompok yang berbeda secara horizontal."},
{q:"Seseorang berpindah dari satu pekerjaan ke pekerjaan lain dengan tingkat prestise dan pendapatan yang relatif setara. Ia tidak mengalami kenaikan atau penurunan lapisan sosial yang berarti. Bentuk mobilitas tersebut adalah ...",a:["mobilitas horizontal karena posisi berubah tanpa kenaikan hierarki","mobilitas vertikal naik karena pekerjaan baru memberi pengalaman","mobilitas vertikal turun karena pekerjaan sebelumnya ditinggalkan","mobilitas antargenerasi karena perpindahan terjadi dalam keluarga"],c:0,e:"Mobilitas horizontal terjadi ketika seseorang berpindah posisi sosial yang relatif sederajat, sehingga tidak terjadi perubahan tinggi-rendah yang berarti."},
{q:"Ayah seorang siswa bekerja sebagai buruh. Setelah dewasa, siswa tersebut menjadi dokter spesialis. Jika perbandingan dilakukan antara kedudukan sosial ayah dan anak, bentuk mobilitas yang terjadi adalah ...",a:["horizontal intragenerasi","vertikal intragenerasi","horizontal antargenerasi","vertikal antargenerasi"],c:3,e:"Antargenerasi membandingkan status generasi berbeda, sedangkan vertikal menunjukkan perubahan naik atau turun. Buruh → dokter menunjukkan kenaikan."},
{q:"Seorang pegawai mulai sebagai staf, kemudian dalam lima belas tahun menjadi kepala divisi karena promosi. Perubahan tersebut termasuk ...",a:["mobilitas vertikal intragenerasi","mobilitas vertikal antargenerasi","mobilitas horizontal intragenerasi","mobilitas horizontal antargenerasi"],c:0,e:"Intragenerasi berarti terjadi dalam riwayat hidup orang yang sama. Staf → kepala divisi menunjukkan perpindahan vertikal naik."},
{q:"Ibu bekerja sebagai guru. Putrinya juga menjadi guru di sekolah lain dengan kedudukan sosial yang relatif setara. Jika fokusnya membandingkan kedudukan ibu dan anak, mobilitas tersebut adalah ...",a:["vertikal intragenerasi","horizontal intragenerasi","vertikal antargenerasi","horizontal antargenerasi"],c:3,e:"Perbandingan ibu dan anak berarti antargenerasi. Karena kedudukannya relatif setara, bentuknya horizontal."},
{q:"Sebuah desa mengalami perubahan struktur ekonomi. Anak petani banyak memperoleh pendidikan tinggi lalu menjadi profesional, sedangkan sebagian orang tua tetap bekerja sebagai petani. Jika dilihat dari perubahan kedudukan anak terhadap orang tua, fenomena tersebut paling tepat disebut ...",a:["mobilitas horizontal antargenerasi","mobilitas vertikal antargenerasi","mobilitas horizontal intragenerasi","mobilitas vertikal intragenerasi"],c:1,e:"Anak dan orang tua berada pada generasi berbeda, dan perubahan dari petani ke profesional dapat menunjukkan kenaikan kedudukan sosial."},
{q:"Perhatikan dua kasus berikut: (1) seseorang naik dari supervisor menjadi manajer; (2) anak seorang pedagang menjadi hakim. Kesimpulan yang paling tepat adalah ...",a:["keduanya horizontal karena hanya terjadi perubahan pekerjaan","kasus 1 vertikal intragenerasi dan kasus 2 vertikal antargenerasi","kasus 1 vertikal antargenerasi dan kasus 2 horizontal intragenerasi","keduanya horizontal antargenerasi karena pekerjaan mengalami perubahan"],c:1,e:"Kasus 1 membandingkan posisi orang yang sama → intragenerasi. Kasus 2 membandingkan anak dengan orang tua → antargenerasi. Keduanya menunjukkan perubahan vertikal."},
{q:"Seorang pegawai dipindahkan dari kantor cabang A ke kantor cabang B dengan jabatan, gaji, dan kewenangan yang sama. Pernyataan yang paling tepat adalah ...",a:["mobilitas vertikal naik karena lokasi kerja berubah","mobilitas vertikal turun karena tidak lagi berada di kantor awal","mobilitas horizontal karena posisi sosial relatif tetap","mobilitas antargenerasi karena terjadi perubahan lingkungan kerja"],c:2,e:"Perubahan tempat kerja tanpa perubahan kedudukan sosial utama merupakan mobilitas horizontal."},
{q:"Dalam masyarakat tertentu, seseorang dapat meningkatkan status melalui pendidikan, tetapi status keluarga dan kekayaan tetap memberi pengaruh kuat terhadap peluangnya. Kondisi ini menunjukkan ...",a:["stratifikasi tertutup sepenuhnya karena pendidikan tidak berpengaruh","stratifikasi terbuka murni karena semua orang memiliki peluang sama","stratifikasi campuran karena ada unsur terbuka dan pengaruh status asal","diferensiasi sosial karena semua lapisan memiliki kedudukan yang setara"],c:2,e:"Stratifikasi campuran dapat memperlihatkan peluang mobilitas melalui prestasi sekaligus pengaruh kuat status asal atau keturunan."},
{q:"Perhatikan situasi: kelompok A dan B memiliki bahasa serta adat berbeda. Dalam pemerintahan, keduanya memiliki hak politik yang sama. Kesimpulan sosiologis yang paling tepat adalah ...",a:["perbedaan tersebut termasuk diferensiasi sosial karena bersifat horizontal","perbedaan tersebut termasuk stratifikasi karena kebudayaan menentukan tingkat sosial","perbedaan tersebut termasuk mobilitas karena identitas kelompok dapat berubah","perbedaan tersebut termasuk stratifikasi tertutup karena berasal dari keturunan"],c:0,e:"Perbedaan bahasa dan adat dapat menjadi diferensiasi sosial apabila tidak digunakan untuk menentukan lapisan tinggi-rendah."},
{q:"Seorang anak dari keluarga berpenghasilan rendah berhasil menjadi pengusaha besar. Namun, keberhasilannya tidak serta-merta mengubah kedudukan sosial saudara-saudaranya. Pernyataan yang paling tepat adalah ...",a:["mobilitas selalu mengubah status seluruh anggota keluarga","mobilitas individu dapat terjadi tanpa seluruh keluarga mengalami perubahan yang sama","mobilitas horizontal pasti terjadi karena keluarga tetap tinggal di daerah yang sama","mobilitas antargenerasi tidak mungkin terjadi karena status awal keluarga rendah"],c:1,e:"Mobilitas sosial dapat dialami individu secara berbeda. Keberhasilan satu anggota keluarga tidak otomatis mengangkat semua anggota ke posisi yang sama."},
{q:"Jika seorang anak mencapai kedudukan sosial lebih rendah daripada orang tuanya akibat kehilangan pekerjaan dan aset, fenomena tersebut disebut ...",a:["mobilitas horizontal antargenerasi","mobilitas vertikal turun antargenerasi","mobilitas horizontal intragenerasi","mobilitas vertikal naik intragenerasi"],c:1,e:"Perbandingan anak dengan orang tua menunjukkan antargenerasi. Kedudukannya lebih rendah berarti vertikal turun."},
{q:"Sebuah organisasi memiliki ketua, wakil ketua, sekretaris, dan anggota. Jika urutan tersebut menunjukkan perbedaan wewenang dan tanggung jawab, aspek struktur sosial yang paling jelas tampak adalah ...",a:["diferensiasi sosial karena semua posisi memiliki fungsi identik","stratifikasi sosial karena posisi tersusun dalam tingkat wewenang","mobilitas sosial karena setiap anggota dapat berganti posisi","diferensiasi sosial karena jabatan hanya menunjukkan perbedaan nama"],c:1,e:"Ketika posisi tersusun berdasarkan tingkat wewenang, terdapat unsur hierarki sehingga dapat dianalisis sebagai stratifikasi dalam organisasi."},
{q:"Seseorang berpindah dari guru SMP menjadi guru SMA tanpa perubahan berarti dalam prestise, pendapatan, dan wewenang. Jika perpindahan terjadi dalam perjalanan karier orang yang sama, klasifikasinya adalah ...",a:["horizontal intragenerasi","horizontal antargenerasi","vertikal intragenerasi","vertikal antargenerasi"],c:0,e:"Orangnya sama → intragenerasi. Kedudukannya relatif setara → horizontal."},
{q:"Perhatikan pasangan berikut: (1) ayah direktur—anak direktur; (2) ayah buruh—anak pengusaha. Jika yang dianalisis adalah arah perubahan status anak terhadap ayah, maka ...",a:["keduanya vertikal karena pekerjaan anak selalu berbeda dari ayah","keduanya horizontal karena keduanya membandingkan dua generasi","kasus 1 cenderung horizontal, kasus 2 menunjukkan vertikal naik","kasus 1 vertikal turun, kasus 2 horizontal karena pekerjaan berubah"],c:2,e:"Kasus 1 relatif setara sehingga horizontal antargenerasi. Kasus 2 menunjukkan kenaikan kedudukan dari buruh ke pengusaha."},
{q:"Dalam sebuah kota, warga dibedakan berdasarkan agama. Pemerintah memberikan pelayanan publik berdasarkan status kewarganegaraan, bukan agama. Mengapa kategori agama lebih tepat disebut diferensiasi daripada stratifikasi dalam konteks tersebut?",a:["karena agama selalu diwariskan dan tidak pernah berubah","karena agama membedakan identitas kelompok tanpa menetapkan tingkatan sosial","karena agama menentukan kekayaan sehingga membentuk lapisan ekonomi","karena agama menentukan kekuasaan sehingga membentuk hierarki pemerintahan"],c:1,e:"Diferensiasi menekankan perbedaan horizontal. Jika agama hanya menjadi kategori identitas tanpa hierarki, ia tidak menunjukkan stratifikasi."},
{q:"Seorang pegawai mengalami PHK lalu bekerja sebagai pegawai pada perusahaan lain dengan pendapatan dan status yang hampir sama. Apa alasan paling kuat untuk mengategorikannya sebagai mobilitas horizontal?",a:["perpindahan terjadi antarperusahaan tanpa perubahan tingkat kedudukan sosial utama","perpindahan membuat seseorang kehilangan pekerjaan sehingga pasti turun status","perpindahan terjadi dalam satu generasi sehingga selalu bersifat vertikal","perpindahan pekerjaan membuktikan adanya perubahan lapisan sosial secara permanen"],c:0,e:"Kunci klasifikasi adalah arah perubahan status, bukan sekadar perubahan tempat atau pekerjaan. Jika kedudukan relatif sama, mobilitasnya horizontal."},
{q:"Sebuah sekolah menemukan bahwa siswa dari keluarga berstatus ekonomi tinggi lebih sering menjadi pengurus inti organisasi karena memiliki akses jaringan dan pengalaman kepemimpinan. Untuk mengurangi ketimpangan, kebijakan yang paling tepat adalah ...",a:["membatasi siswa kaya agar tidak boleh menjadi pengurus organisasi","menetapkan semua jabatan hanya untuk siswa dari keluarga ekonomi rendah","membuka seleksi dan pembinaan kepemimpinan secara adil bagi seluruh siswa","menghapus seluruh struktur organisasi agar tidak ada perbedaan kedudukan"],c:2,e:"Kebijakan yang memperluas akses dan kesempatan secara adil lebih tepat daripada membatasi kelompok tertentu atau menghapus organisasi."},
{q:"Seorang peneliti membandingkan kehidupan sosial tiga keluarga. Keluarga pertama tetap pada lapisan ekonomi yang sama selama dua generasi; keluarga kedua mengalami kenaikan status dalam satu generasi; keluarga ketiga berpindah pekerjaan tetapi tetap pada lapisan yang sama. Urutan konsep yang tepat adalah ...",a:["statis antargenerasi; vertikal intragenerasi; horizontal intragenerasi","horizontal antargenerasi; vertikal antargenerasi; vertikal intragenerasi","vertikal intragenerasi; horizontal antargenerasi; vertikal antargenerasi","tertutup; diferensiasi; stratifikasi terbuka"],c:0,e:"Kasus 1 tidak menunjukkan perpindahan lapisan; kasus 2 kenaikan dalam hidup orang yang sama; kasus 3 perpindahan posisi setara dalam satu generasi."}
];

let i=0, score=0, time=120, timer=null, locked=false;
function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();}
function render(){
 locked=false; time=120;
 document.getElementById('num').textContent=`Soal ${i+1} dari ${questions.length}`;
 document.getElementById('score').textContent=`Skor sementara: ${score}`;
 document.getElementById('fill').style.width=((i)/questions.length*100)+'%';
 document.getElementById('question').textContent=questions[i].q;
 const box=document.getElementById('options');box.innerHTML='';
 let arr=questions[i].a.map((text,idx)=>({text,idx})).sort(()=>Math.random()-.5);
 arr.forEach(x=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+arr.indexOf(x))}.</b> ${x.text}`;b.onclick=()=>answer(b,x.idx);box.appendChild(b)});
 const fb=document.getElementById('feedback');fb.style.display='none';fb.className='feedback';
 document.getElementById('next').style.display='none'; updateTimer();
 clearInterval(timer);timer=setInterval(()=>{time--;updateTimer();if(time<=0){clearInterval(timer);if(!locked) answer(null,-1)}},1000);
}
function updateTimer(){let m=String(Math.floor(time/60)).padStart(2,'0'),s=String(time%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`}
function answer(btn,chosen){
 if(locked)return; locked=true; clearInterval(timer);
 const q=questions[i], buttons=[...document.querySelectorAll('.opt')];
 buttons.forEach(b=>b.disabled=true);
 let correct=q.c, correctButton=null;
 buttons.forEach(b=>{let letter=b.querySelector('b').textContent.charCodeAt(0)-65;if(q.a.indexOf(b.textContent.slice(3))===correct) correctButton=b});
 // identify by text safely
 buttons.forEach(b=>{if(b.textContent.slice(3)===q.a[correct]) correctButton=b});
 if(chosen===correct){score+=4;btn?.classList.add('correct');showFeedback(true,q.e)}
 else {btn?.classList.add('wrong');correctButton?.classList.add('correct');showFeedback(false,q.e)}
 document.getElementById('score').textContent=`Skor sementara: ${score}`;
 document.getElementById('next').style.display='block';
 document.getElementById('next').textContent=i===questions.length-1?'Lihat Hasil':'Soal Berikutnya →';
}
function showFeedback(ok,e){let f=document.getElementById('feedback');f.style.display='block';f.className='feedback '+(ok?'fb-c':'fb-w');f.innerHTML=`<b>${ok?'✓ Benar':'✗ Salah'}</b><br>${e}`}
function nextQ(){i++;if(i>=questions.length){finish();return}render()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=score+'/100';document.getElementById('finalText').textContent=`Jawaban benar: ${score/4} dari ${questions.length}. Setiap soal bernilai 4 poin.`}
</script>
</body></html>
